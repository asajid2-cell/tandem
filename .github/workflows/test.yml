name: test
on:
  push:
  pull_request:
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install needed — the suite uses only node:test + a fake partner (no deps).
      - run: node --test "test/*.test.mjs"
