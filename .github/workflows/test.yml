name: test
on:
  push:
  pull_request:
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install needed — the suite uses only node:test + a fake partner (no deps).
      # Concurrency is BOUNDED: these are real-time supervision tests (sub-second stall windows
      # measured against freshly spawned process trees). Unbounded file parallelism on a many-core
      # machine floods the box with node cold-starts and blows the very windows under test.
      - run: node --test --test-concurrency=4 "test/*.test.mjs"
